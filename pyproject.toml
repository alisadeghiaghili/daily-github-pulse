[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-github-pulse"
version = "3.2.0"
description = "Multi-forge trending repositories and developers with star velocity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ali Aghili" }]
keywords = ["github", "gitlab", "gitea", "bitbucket", "trending", "velocity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
rich = ["rich>=13.7.0"]
ai = ["openai>=1.30.0", "anthropic>=0.25.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
daily-github-pulse = "daily_github_pulse.cli:main"

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/daily-github-pulse"
Changelog = "https://github.com/alisadeghiaghili/daily-github-pulse/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = [
    "daily_github_pulse",
    "github_repo_of_the_day",
    "rich_display",
    "forges",
]
